# Panel view with the Luxtronik heat pump card.
# Dashboard -> add view -> ⋮ -> "Edit in YAML" -> paste.
# Everything below `type:` is optional; the card can also be configured in the UI editor.
title: Heat pump
path: heat-pump
icon: mdi:heat-pump-outline
type: panel
cards:
